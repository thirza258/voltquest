# Full stack with PostgreSQL:  docker compose up --build   ->  http://localhost:8080
# Lighter SQLite variant:      docker compose -f docker-compose.lite.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voltquest
      POSTGRES_USER: voltquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltquest}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltquest -d voltquest"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://voltquest:${POSTGRES_PASSWORD:-voltquest}@db:5432/voltquest
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      CONTENT_DIR: /content
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-openai/gpt-4.1-mini}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-pcb.nevatal.id,localhost,localhost:*,127.0.0.1,127.0.0.1:*,backend:8000,testserver}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
