<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>VoltQuest — learn electronics by playing</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D9488'/%3E%3Cpath d='M18 4 9 18h6l-1 10 9-14h-6z' fill='%23FBBF24'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (() => {
        function registerWebMcpTools() {
          if (!('modelContext' in navigator) || !navigator.modelContext) return;
          try {
            const controller = new AbortController();
            navigator.modelContext.registerTool({
              name: 'search_voltquest',
              title: 'Search VoltQuest',
              description: 'Search VoltQuest electronics courses, tutorials, and circuit modules.',
              inputSchema: {
                type: 'object',
                properties: {
                  query: { type: 'string', description: 'Search term for electronics or PCB topics' }
                },
                required: ['query']
              },
              execute: async ({ query }) => {
                return {
                  content: [{ type: 'text', text: `Results for ${query}: Visit https://pcb.nevatal.id/courses or /tutorials` }]
                };
              }
            }, { signal: controller.signal });
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', registerWebMcpTools);
        } else {
          registerWebMcpTools();
        }
      })();
    </script>
  </head>
  <body class="bg-surface-page text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
