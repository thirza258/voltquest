server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Monaco and Blockly are large; compressing them is what keeps the PRD's
    # "< 3 s initial load on 15 Mbps" budget reachable.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No CSP: the app runs Monaco/Blockly web workers and renders the Virtual Phone
    # in a sandboxed blob iframe, both of which a restrictive policy would break.

    # NOTE: do not declare a `types { ... }` block here — it would REPLACE nginx's inherited
    # mime.types map, and every asset would be served as application/octet-stream, which
    # `nosniff` above turns into a refusal to execute the app's module scripts.
    # The stock map already covers js, css and wasm.

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail fast when the API is still booting so the client shows its
        # offline state instead of hanging on the first request.
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
